# Downloads the Wikimedia Commons diagrams listed in data/media.json and commits
# them back to the same branch. Runs on GitHub's servers, which can reach
# Wikimedia. It never pushes to main (main is protected) and never marks a
# diagram as accepted: a person still has to look at each one.
name: Fetch diagrams
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: [data/media.json, tools/fetch_commons.py]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow
      - name: Download and verify licences
        run: python3 tools/fetch_commons.py
      - name: Commit diagrams and licence data
        run: |
          if git diff --quiet -- data/media.json && [ -z "$(git status --porcelain assets/diagrams)" ]; then echo "Nothing new."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/diagrams data/media.json
          git commit -m "Fetch Commons diagrams and licence data"
          git push
